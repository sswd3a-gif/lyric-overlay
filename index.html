<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lyric Overlay</title>
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --line: #2a2f3a; --text: #e8eaf0; --muted: #8a91a3;
    --accent: #4f8cff;
    --lyric-color: #ffffff; --lyric-size: 44px; --lyric-pos: 8%; --trans-color: #ffe08a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, "Segoe UI", "Yu Gothic UI", sans-serif; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0 12px 0 0; }
  input, textarea, select, button { font: inherit; color: var(--text); background: #11141a; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  button { cursor: pointer; background: #222838; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.rec { background: #c0392b; border-color: #c0392b; color: #fff; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; padding: 16px; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
  #stage { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; }
  #stage:fullscreen { border-radius: 0; aspect-ratio: auto; }
  #player, #stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; }
  #overlay { position: absolute; left: 0; right: 0; bottom: var(--lyric-pos); text-align: center; pointer-events: none; padding: 0 4%; }
  #overlay.top { bottom: auto; top: var(--lyric-pos); }
  #cur { color: var(--lyric-color); font-size: var(--lyric-size); font-weight: 800; line-height: 1.25;
         text-shadow: 0 0 6px #000, 0 2px 4px #000, 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
         transition: opacity .25s; min-height: 1.25em; }
  #trans { color: var(--trans-color); font-size: calc(var(--lyric-size) * .6); font-weight: 700; margin-top: .2em;
           text-shadow: 0 0 5px #000, 2px 2px 0 #000, -2px -2px 0 #000; min-height: 1.2em; }
  #next { color: rgba(255,255,255,.65); font-size: calc(var(--lyric-size) * .5); margin-top: .3em; text-shadow: 0 0 5px #000, 1px 1px 0 #000; }
  #stage:fullscreen #cur, #stage.pseudo-fs #cur { font-size: calc(var(--lyric-size) * 1.6); }
  /* iPhone Safari は div の全画面化に非対応 → 画面いっぱいに広げる代替表示 */
  #stage.pseudo-fs { position: fixed; inset: 0; z-index: 1000; aspect-ratio: auto; border-radius: 0; }
  #exitFs { display: none; position: absolute; top: 10px; right: 10px; z-index: 2; background: rgba(0,0,0,.55); border: 0; color: #fff; font-size: 18px; }
  #stage.pseudo-fs #exitFs { display: block; }
  #tapBtn { display: none; width: 100%; padding: 18px; font-size: 18px; margin-top: 6px; }
  #tapBtn.show { display: block; }
  #lines { position: relative; }
  @media (max-width: 1000px) {
    /* スマホ・タブレットでは動画を画面上部に固定して、下をスクロールしても見え続けるように */
    #stage { position: sticky; top: 0; z-index: 10; }
    #stage.pseudo-fs { position: fixed; }
  }
  @media (max-width: 600px) {
    main { padding: 8px; gap: 8px; }
    :root { --lyric-size: 22px; }
    header h1 { display: none; }
  }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .panel h2 { font-size: 13px; margin: 0 0 8px; color: var(--muted); font-weight: 600; letter-spacing: .04em; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
  .row label { color: var(--muted); min-width: 64px; }
  textarea { width: 100%; min-height: 220px; resize: vertical; font-family: Consolas, monospace; font-size: 12.5px; }
  #transText { min-height: 100px; }
  #lines { max-height: 260px; overflow: auto; font-size: 13px; }
  #lines div { padding: 3px 6px; border-radius: 4px; cursor: pointer; display: flex; gap: 8px; }
  #lines div .t { color: var(--muted); font-family: Consolas, monospace; min-width: 62px; }
  #lines div.on { background: #24304a; }
  #lines div.notime .t { color: #c0392b; }
  #status { color: var(--muted); font-size: 12px; min-height: 1.4em; }
  #results div { padding: 4px 6px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 13px; }
  #results div:hover { background: #222838; }
  .hint { color: var(--muted); font-size: 12px; }
  kbd { background: #2a2f3a; border-radius: 3px; padding: 0 4px; font-size: 11px; }
</style>
</head>
<body>
<header>
  <h1>🎵 Lyric Overlay</h1>
  <input id="url" placeholder="YouTube URL または動画ID" style="flex:1;min-width:260px">
  <button class="primary" id="loadBtn">読み込み</button>
  <button id="fsBtn" title="歌詞付きで全画面表示">⛶ 全画面</button>
</header>

<main>
  <section>
    <div id="stage">
      <div id="player"></div>
      <div id="overlay"><div id="cur"></div><div id="trans"></div><div id="next"></div></div>
      <button id="exitFs">✕</button>
    </div>
    <div id="status"></div>
    <div class="row" style="margin-top:8px">
      <button id="loopBtn">🔁 この行をリピート</button>
      <button id="prevBtn">⏮ 前の行</button>
      <button id="againBtn">↺ もう一度</button>
      <label style="min-width:auto">速度</label>
      <select id="rate"><option>0.5</option><option>0.75</option><option selected>1</option><option>1.25</option></select>
    </div>

    <div class="panel" style="margin-top:12px">
      <h2>表示スタイル</h2>
      <div class="row">
        <label>文字サイズ</label><input type="range" id="size" min="20" max="90" value="44">
        <label>位置</label><select id="pos"><option value="bottom">下</option><option value="top">上</option></select>
        <input type="range" id="posv" min="2" max="40" value="8">
      </div>
      <div class="row">
        <label>文字色</label><input type="color" id="color" value="#ffffff">
        <label>訳の色</label><input type="color" id="tcolor" value="#ffe08a">
        <label><input type="checkbox" id="showNext" checked> 次の行</label>
      </div>
      <div class="row">
        <label>オフセット</label><input type="range" id="offset" min="-5000" max="5000" step="50" value="0" style="flex:1">
        <span id="offsetV">0 ms</span>
      </div>
    </div>
  </section>

  <aside>
    <div class="panel">
      <h2>歌詞を検索（LRCLIB）</h2>
      <div class="row"><input id="qArtist" placeholder="アーティスト" style="flex:1"><input id="qTitle" placeholder="曲名" style="flex:1"></div>
      <div class="row"><button id="searchBtn">検索</button><span class="hint">同期歌詞（タイムスタンプ付き）があれば自動で使います</span></div>
      <div id="results"></div>
    </div>

    <div class="panel">
      <h2>歌詞（LRC またはプレーンテキスト）</h2>
      <textarea id="lyricText" placeholder="[00:12.30]1行目の歌詞&#10;[00:16.80]2行目の歌詞&#10;&#10;タイムスタンプなしのテキストでもOK → 下の「タップ同期」で時刻を付けられます"></textarea>
      <div class="row" style="margin-top:6px">
        <button id="applyBtn" class="primary">反映</button>
        <label class="hint" style="min-width:auto"><input type="file" id="lrcFile" accept=".lrc,.txt,.srt" style="width:160px"></label>
      </div>
      <h2 style="margin-top:10px">和訳（任意・1行ずつ対応）</h2>
      <textarea id="transText" placeholder="歌詞の各行に対応する訳を同じ行順で"></textarea>
    </div>

    <div class="panel">
      <h2>タップ同期</h2>
      <div class="row">
        <button id="syncBtn">同期モード開始</button>
        <span class="hint">再生中に <kbd>Space</kbd> で次の行の開始時刻を記録 / <kbd>Backspace</kbd> で1行戻る</span>
      </div>
      <button id="tapBtn" class="primary">● タップ（この行の開始）</button>
      <div id="lines"></div>
    </div>

    <div class="panel">
      <h2>書き出し（動画作成用）</h2>
      <div class="row">
        <button data-exp="lrc">LRC</button><button data-exp="srt">SRT</button><button data-exp="ass">ASS（スタイル付き）</button>
      </div>
      <div class="hint">ASS を <code>burn.py</code> で手元の動画ファイルに焼き込むと歌詞付き動画になります。</div>
    </div>
  </aside>
</main>

<script>
const $ = (id) => document.getElementById(id);
let player = null, lines = [], trans = [], offsetMs = 0, syncMode = false, syncIdx = 0, lastIdx = -2;

/* ---------- YouTube ---------- */
function parseId(s) {
  s = s.trim();
  if (/^[\w-]{11}$/.test(s)) return s;
  try {
    const u = new URL(s);
    if (u.hostname.includes('youtu.be')) return u.pathname.slice(1, 12);
    if (u.searchParams.get('v')) return u.searchParams.get('v');
    const m = u.pathname.match(/\/(embed|shorts|live)\/([\w-]{11})/);
    if (m) return m[2];
  } catch {}
  return null;
}
window.onYouTubeIframeAPIReady = () => { status('YouTube プレイヤー準備OK。URL を入れて「読み込み」'); };
$('loadBtn').onclick = () => {
  const id = parseId($('url').value);
  if (!id) return status('URL から動画IDを読み取れませんでした');
  if (player && player.loadVideoById) { player.loadVideoById(id); return; }
  player = new YT.Player('player', {
    videoId: id,
    playerVars: { rel: 0, modestbranding: 1, playsinline: 1, fs: 0 },
    events: {
      onReady: () => { status('読み込み完了'); guessTitle(); requestAnimationFrame(tick); },
      onStateChange: (e) => { if (e.data === YT.PlayerState.PLAYING) guessTitle(); },
      onError: (e) => status('再生エラー (' + e.data + ')：この動画は埋め込み再生が禁止されている可能性があります'),
    },
  });
};
$('url').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('loadBtn').click(); });
function guessTitle() {
  const d = player.getVideoData && player.getVideoData();
  if (!d || !d.title || $('qTitle').value) return;
  // "Artist - Title (Official Video)" 形式を推測
  let t = d.title.replace(/[\(\[].*?(official|video|lyric|audio|mv|hd|4k|remaster).*?[\)\]]/gi, '').trim();
  const m = t.split(/\s[-–—]\s/);
  if (m.length >= 2) { $('qArtist').value = m[0].trim(); $('qTitle').value = m.slice(1).join(' - ').trim(); }
  else { $('qTitle').value = t; $('qArtist').value = (d.author || '').replace(/VEVO$/i, '').replace(/ - Topic$/, ''); }
}
$('fsBtn').onclick = () => {
  const st = $('stage');
  if (document.fullscreenElement) return document.exitFullscreen();
  if (st.requestFullscreen) {
    st.requestFullscreen().then(() => screen.orientation?.lock?.('landscape').catch(() => {})).catch(() => st.classList.add('pseudo-fs'));
  } else st.classList.add('pseudo-fs');
};
$('exitFs').onclick = () => $('stage').classList.remove('pseudo-fs');

/* ---------- 歌詞パース ---------- */
function parseLyrics(text) {
  const out = []; let fileOffset = 0;
  const srt = /^\d+\s*\n\d{2}:\d{2}:\d{2}[,.]\d{3}\s*-->/m.test(text);
  if (srt) {
    for (const b of text.split(/\r?\n\r?\n/)) {
      const m = b.match(/(\d{2}):(\d{2}):(\d{2})[,.](\d{3})\s*-->.*\r?\n([\s\S]*)/);
      if (m) out.push({ t: (+m[1]) * 3600 + (+m[2]) * 60 + (+m[3]) + (+m[4]) / 1000, text: m[5].replace(/\r?\n/g, ' ').trim() });
    }
    return out;
  }
  for (const raw of text.split(/\r?\n/)) {
    const off = raw.match(/^\[offset:\s*([+-]?\d+)\]/i);
    if (off) { fileOffset = +off[1] / 1000; continue; }
    if (/^\[(ar|ti|al|by|length|re|ve|au):/i.test(raw)) continue;
    const stamps = [...raw.matchAll(/\[(\d{1,2}):(\d{2})(?:[.:](\d{1,3}))?\]/g)];
    const body = raw.replace(/\[\d{1,2}:\d{2}(?:[.:]\d{1,3})?\]/g, '').replace(/<\d{1,2}:\d{2}(?:[.:]\d{1,3})?>/g, '').trim();
    if (stamps.length) {
      for (const s of stamps) {
        const frac = s[3] ? +s[3] / Math.pow(10, s[3].length) : 0;
        out.push({ t: (+s[1]) * 60 + (+s[2]) + frac - fileOffset, text: body });
      }
    } else if (body) out.push({ t: null, text: body });
  }
  if (out.every(l => l.t !== null)) out.sort((a, b) => a.t - b.t);
  return out;
}
function applyLyrics() {
  lines = parseLyrics($('lyricText').value);
  trans = $('transText').value.split(/\r?\n/).filter(s => s.trim() !== '');
  const timed = lines.filter(l => l.t !== null).length;
  status(`${lines.length} 行を読み込み（時刻あり ${timed} 行）` + (timed < lines.length ? '：時刻なしの行は「タップ同期」で設定してください' : ''));
  lastIdx = -2; renderLines();
}
$('applyBtn').onclick = applyLyrics;
$('transText').addEventListener('change', applyLyrics);
$('lrcFile').onchange = async (e) => { const f = e.target.files[0]; if (f) { $('lyricText').value = await f.text(); applyLyrics(); } };

/* ---------- LRCLIB ---------- */
$('searchBtn').onclick = async () => {
  const q = new URLSearchParams();
  if ($('qTitle').value) q.set('track_name', $('qTitle').value);
  if ($('qArtist').value) q.set('artist_name', $('qArtist').value);
  if (![...q.keys()].length) return status('曲名かアーティストを入れてください');
  $('results').textContent = '検索中…';
  try {
    const r = await fetch('https://lrclib.net/api/search?' + q);
    const list = await r.json();
    $('results').textContent = list.length ? '' : '見つかりませんでした（曲名だけで再検索してみてください）';
    list.slice(0, 12).forEach(it => {
      const d = document.createElement('div');
      const dur = it.duration ? ` ${Math.floor(it.duration / 60)}:${String(Math.round(it.duration % 60)).padStart(2, '0')}` : '';
      d.textContent = `${it.syncedLyrics ? '⏱' : '📝'} ${it.artistName} — ${it.trackName}${dur}`;
      d.title = it.syncedLyrics ? '同期歌詞あり' : 'テキストのみ（タップ同期が必要）';
      d.onclick = () => { $('lyricText').value = it.syncedLyrics || it.plainLyrics || ''; applyLyrics(); };
      $('results').appendChild(d);
    });
  } catch (err) { $('results').textContent = '検索に失敗: ' + err.message; }
};

/* ---------- 再生同期 ---------- */
function nowSec() { return player && player.getCurrentTime ? player.getCurrentTime() : 0; }
function currentIndex(t) {
  let idx = -1;
  for (let i = 0; i < lines.length; i++) { if (lines[i].t !== null && lines[i].t <= t) idx = i; else if (lines[i].t !== null) break; }
  return idx;
}
let loopIdx = -1;
function lineStart(i) { return lines[i].t + offsetMs / 1000; }
function nextTimed(i) { for (let j = i + 1; j < lines.length; j++) if (lines[j].t !== null) return j; return -1; }
function tick() {
  const t = nowSec() - offsetMs / 1000;
  if (loopIdx >= 0) {
    const nj = nextTimed(loopIdx);
    const end = nj >= 0 ? lines[nj].t : lines[loopIdx].t + 6;
    if (t >= end - 0.05 || t < lines[loopIdx].t - 1) player.seekTo(lineStart(loopIdx), true);
  }
  const idx = currentIndex(t);
  if (idx !== lastIdx) {
    lastIdx = idx;
    $('cur').textContent = idx >= 0 ? lines[idx].text : '';
    $('trans').textContent = idx >= 0 && trans[idx] ? trans[idx] : '';
    const nx = lines[idx + 1];
    $('next').textContent = $('showNext').checked && nx ? nx.text : '';
    document.querySelectorAll('#lines div').forEach((el, i) => el.classList.toggle('on', i === idx));
    const on = document.querySelector('#lines div.on'); if (on && !syncMode) scrollListTo(on);
  }
  requestAnimationFrame(tick);
}
function fmt(t) { if (t === null) return '--:--.--'; const m = Math.floor(t / 60), s = t - m * 60; return `${String(m).padStart(2, '0')}:${s.toFixed(2).padStart(5, '0')}`; }
function renderLines() {
  const box = $('lines'); box.innerHTML = '';
  lines.forEach((l, i) => {
    const d = document.createElement('div'); if (l.t === null) d.className = 'notime';
    d.innerHTML = `<span class="t">${fmt(l.t)}</span><span></span>`; d.lastChild.textContent = l.text;
    d.onclick = () => { if (syncMode) { syncIdx = i; markSync(); } else if (l.t !== null && player) player.seekTo(l.t + offsetMs / 1000, true); };
    box.appendChild(d);
  });
}

/* ---------- タップ同期 ---------- */
function markSync() { document.querySelectorAll('#lines div').forEach((el, i) => el.style.outline = syncMode && i === syncIdx ? '1px solid #4f8cff' : ''); }
$('syncBtn').onclick = () => {
  syncMode = !syncMode;
  $('syncBtn').textContent = syncMode ? '同期モード終了' : '同期モード開始';
  $('syncBtn').className = syncMode ? 'rec' : '';
  $('tapBtn').classList.toggle('show', syncMode);
  if (syncMode) { syncIdx = Math.max(0, lines.findIndex(l => l.t === null)); status('同期モード：曲を再生し、各行が歌い始めた瞬間に Space'); }
  markSync();
};
document.addEventListener('keydown', (e) => {
  if (!syncMode || ['TEXTAREA', 'INPUT'].includes(document.activeElement.tagName)) return;
  if (e.code === 'Space') { e.preventDefault(); stamp(); }
  else if (e.code === 'Backspace') {
    e.preventDefault(); if (syncIdx > 0) { syncIdx--; lines[syncIdx].t = null; renderLines(); markSync(); writeBackLrc(); }
  }
});
function stamp() {
  if (syncIdx >= lines.length) return;
  lines[syncIdx].t = Math.max(0, nowSec() - offsetMs / 1000 - 0.15); // 反応遅れを少し補正
  syncIdx++; lastIdx = -2; renderLines(); markSync(); writeBackLrc();
  const el = $('lines').children[syncIdx]; if (el) scrollListTo(el);
}
// ページ全体は動かさず、歌詞一覧の枠の中だけをスクロールする
function scrollListTo(el) {
  const box = $('lines');
  box.scrollTop = el.offsetTop - box.offsetTop - box.clientHeight / 2 + el.clientHeight / 2;
}
$('tapBtn').addEventListener('pointerdown', (e) => { e.preventDefault(); stamp(); });
function writeBackLrc() { $('lyricText').value = toLrc(); }

/* ---------- 書き出し ---------- */
function timed() { return lines.filter(l => l.t !== null).map((l, i) => ({ ...l, tr: trans[lines.indexOf(l)] || '' })); }
function endOf(arr, i) { return arr[i + 1] ? arr[i + 1].t : arr[i].t + 5; }
function toLrc() { return lines.map(l => (l.t === null ? '' : `[${fmt(l.t)}]`) + l.text).join('\n'); }
function srtTime(t) { const ms = Math.round(t * 1000), h = Math.floor(ms / 3600000), m = Math.floor(ms / 60000) % 60, s = Math.floor(ms / 1000) % 60; return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')},${String(ms % 1000).padStart(3, '0')}`; }
function assTime(t) { const cs = Math.round(t * 100), h = Math.floor(cs / 360000), m = Math.floor(cs / 6000) % 60, s = Math.floor(cs / 100) % 60; return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(cs % 100).padStart(2, '0')}`; }
function assColor(hex) { const h = hex.replace('#', ''); return `&H00${h.slice(4, 6)}${h.slice(2, 4)}${h.slice(0, 2)}`.toUpperCase(); }
function toSrt() { const a = timed(); return a.map((l, i) => `${i + 1}\n${srtTime(l.t)} --> ${srtTime(endOf(a, i))}\n${l.text}${l.tr ? '\n' + l.tr : ''}\n`).join('\n'); }
function toAss() {
  const a = timed(), size = Math.round(+$('size').value * 1.5), top = $('pos').value === 'top';
  const marginV = Math.round(1080 * +$('posv').value / 100), align = top ? 8 : 2;
  const esc = (s) => s.replace(/[{}]/g, '').replace(/\n/g, '\\N');
  let s = `[Script Info]\nScriptType: v4.00+\nPlayResX: 1920\nPlayResY: 1080\nWrapStyle: 0\nScaledBorderAndShadow: yes\n\n[V4+ Styles]\n` +
    `Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding\n` +
    `Style: Lyric,Arial,${size},${assColor($('color').value)},&H000000FF,&H00000000,&H80000000,-1,0,0,0,100,100,0,0,1,4,2,${align},80,80,${marginV},1\n` +
    `Style: Trans,Yu Gothic UI,${Math.round(size * .6)},${assColor($('tcolor').value)},&H000000FF,&H00000000,&H80000000,-1,0,0,0,100,100,0,0,1,3,2,${align},80,80,${marginV},1\n\n` +
    `[Events]\nFormat: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text\n`;
  const off = offsetMs / 1000;
  a.forEach((l, i) => {
    if (!l.text) return;
    const st = assTime(Math.max(0, l.t + off)), en = assTime(Math.max(0, endOf(a, i) + off));
    const tr = l.tr ? `\\N{\\rTrans}${esc(l.tr)}` : '';
    s += `Dialogue: 0,${st},${en},Lyric,,0,0,0,,{\\fad(150,150)}${esc(l.text)}${tr}\n`;
  });
  return s;
}
document.querySelectorAll('[data-exp]').forEach(b => b.onclick = () => {
  if (!timed().length) return status('時刻付きの行がありません');
  const kind = b.dataset.exp, body = kind === 'lrc' ? toLrc() : kind === 'srt' ? toSrt() : toAss();
  const name = (($('qArtist').value + ' - ' + $('qTitle').value).replace(/^ - | - $/g, '') || 'lyrics').replace(/[\\/:*?"<>|]/g, '_');
  const blob = new Blob(['﻿' + body], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${name}.${kind}`; a.click();
});

/* ---------- スタイル ---------- */
const root = document.documentElement.style;
$('size').oninput = (e) => root.setProperty('--lyric-size', e.target.value + 'px');
$('posv').oninput = (e) => root.setProperty('--lyric-pos', e.target.value + '%');
$('pos').onchange = (e) => $('overlay').classList.toggle('top', e.target.value === 'top');
$('color').oninput = (e) => root.setProperty('--lyric-color', e.target.value);
$('tcolor').oninput = (e) => root.setProperty('--trans-color', e.target.value);
$('showNext').onchange = () => { lastIdx = -2; };
$('offset').oninput = (e) => { offsetMs = +e.target.value; $('offsetV').textContent = (offsetMs > 0 ? '+' : '') + offsetMs + ' ms'; lastIdx = -2; };
function status(s) { $('status').textContent = s; }

/* ---------- 学習用コントロール ---------- */
$('loopBtn').onclick = () => {
  if (loopIdx >= 0) { loopIdx = -1; $('loopBtn').className = ''; return; }
  const i = currentIndex(nowSec() - offsetMs / 1000);
  if (i < 0) return status('歌詞の行が表示されている時に押してください');
  loopIdx = i; $('loopBtn').className = 'rec';
};
$('againBtn').onclick = () => { const i = loopIdx >= 0 ? loopIdx : currentIndex(nowSec() - offsetMs / 1000); if (i >= 0) player.seekTo(lineStart(i), true); };
$('prevBtn').onclick = () => {
  let i = currentIndex(nowSec() - offsetMs / 1000) - 1;
  while (i >= 0 && lines[i].t === null) i--;
  if (i >= 0) { if (loopIdx >= 0) loopIdx = i; player.seekTo(lineStart(i), true); }
};
$('rate').onchange = (e) => player && player.setPlaybackRate(+e.target.value);
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
